      - name: Index Arclight
        run: bun run index-arclight.ts
        working-directory: ./indexers

  revalidate-pages:
    name: Trigger Revalidation
    runs-on: ubuntu-latest
    needs:
      - index-paper
      - index-vanilla
      - index-purpur
      - index-fabric
      - index-velocity
      - index-waterfall
      - index-bungeecord
      - index-pufferfish
      - index-forge
      - index-neoforge
      - index-sponge
      - index-mohist
      - index-arclight
    if: always()
    steps:
      - name: Trigger revalidation
        run: |
          curl -X POST "${{ secrets.REVALIDATION_URL }}" \
            -H "Authorization: Bearer ${{ secrets.REVALIDATION_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"paths": ["/", "/paper", "/vanilla", "/fabric", "/purpur", "/velocity", "/waterfall", "/bungeecord", "/pufferfish", "/forge", "/neoforge", "/sponge", "/mohist", "/arclight"]}'
        continue-on-error: true
